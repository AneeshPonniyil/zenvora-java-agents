# Local services used by later chapters. Not needed to build the skeleton.
# Start with:  docker compose up -d
services:
  postgres:
    # Postgres with the pgvector extension. Used from Chapter 7 (RAG).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents_local_only
      POSTGRES_DB: agents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
